<!DOCTYPE html>
<html>
<head>
    <title>My Quiz</title>
</head>

<body>
    <h1>My Anatomy Quiz</h1>

    <p>1. How many pairs of true ribs are there?</p>

    <button onclick="checkAnswer('A')">A. 5 pairs</button>
    <button onclick="checkAnswer('B')">B. 7 pairs</button>
    <button onclick="checkAnswer('C')">C. 10 pairs</button>
    <button onclick="checkAnswer('D')">D. 12 pairs</button>

    <p id="result"></p>

    <script>
        function checkAnswer(answer) {
            if (answer === 'B') {
                document.getElementById("result").innerText =
                    "Correct! 🎉";
            } else {
                document.getElementById("result").innerText =
                    "Incorrect. Try again!";
            }
        }
    </script>
</body>
</html>
