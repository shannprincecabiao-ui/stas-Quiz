<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extreme Anatomy & Physiology</title>
<style>
:root{--bg:#07111f;--card:#101d30;--card2:#14243a;--text:#f4f7fb;--muted:#9aa9bc;--blue:#4da3ff;--green:#31d17c;--red:#ff5c68;--gold:#ffd166;--border:#263b56}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:radial-gradient(circle at top left,#17345a,transparent 38%),radial-gradient(circle at bottom right,#122d4a,transparent 40%),var(--bg);color:var(--text)}
.header{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#07111fe8}
.home{display:flex;align-items:center;gap:7px;text-decoration:none;color:#fff;background:#13263e;border:1px solid var(--border);padding:8px 13px;border-radius:10px;transition:.2s}
.home:hover{border-color:var(--blue);transform:translateX(-2px);box-shadow:0 0 15px #4da3ff33}
.home svg{width:17px}
.headRight{display:flex;align-items:center;gap:10px;font-size:12px}
.badge{color:var(--gold);border:1px solid #ffd16655;background:#ffd16612;padding:6px 10px;border-radius:20px;font-weight:bold}
.progressText{color:var(--muted)}
main{height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:10px}
.quiz{width:min(900px,100%);height:100%;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-height:calc(100vh - 80px);background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 15px 45px #0008;display:flex;flex-direction:column}
.qnum{color:var(--blue);font-size:12px;font-weight:bold;margin-bottom:6px}
.question{font-size:21px;line-height:1.25;margin:0 0 12px}
.qimage{display:block;max-width:100%;height:auto;max-height:170px;margin:0 auto 10px;border-radius:10px;border:1px solid var(--border)}
.options{display:grid;gap:7px}
.option{width:100%;padding:10px 12px;text-align:left;background:#0c1829;color:var(--text);border:1px solid var(--border);border-radius:9px;font-size:14px;cursor:pointer;transition:.18s}
.option:hover:not(:disabled){border-color:var(--blue);background:#122640;transform:translateX(2px)}
.option.correct{background:#31d17c1c;border-color:var(--green);color:#9fffc5}
.option.wrong{background:#ff5c681c;border-color:var(--red);color:#ffb1b7}
.option:disabled{cursor:default}
.explain{display:none;margin-top:9px;padding:9px 11px;background:#4da3ff0d;border:1px solid #4da3ff30;border-radius:9px;color:#cbd9e9;font-size:12px;line-height:1.4}
.explain.show{display:block}
.controls{display:flex;justify-content:space-between;gap:8px;margin-top:11px}
.btn{border:1px solid var(--border);background:#14263d;color:white;padding:9px 15px;border-radius:9px;font-weight:bold;cursor:pointer;transition:.2s;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--blue);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.next{background:#155d3c;border-color:#238c5d}
.results{display:none;text-align:center;align-items:center;justify-content:center}
.results.show{display:flex}
.results h1{font-size:30px;margin:0 0 6px}
.score{font-size:52px;font-weight:bold;color:var(--gold);margin:5px}
.percent{font-size:21px;color:var(--blue);font-weight:bold}
.message{max-width:600px;color:#c5d2e2;font-size:14px;line-height:1.5;margin:12px 0 18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.primary{background:#155d9d;border-color:#287fca}
@media(max-width:600px){
.header{padding:0 10px}.badge{display:none}main{padding:7px}.card{padding:13px;border-radius:14px}
.question{font-size:18px}.option{font-size:13px;padding:9px}.qimage{max-height:130px}.results h1{font-size:24px}
}
</style>
</head>
<body>

<header class="header">
<a href="../main.html" class="home">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path>
</svg>
Main Menu
</a>
<div class="headRight"><span class="badge">EXTREME · 100</span><span class="progressText" id="progress">0 / 100</span></div>
</header>

<main>
<div class="quiz">

<div class="card" id="quizCard">
<div class="qnum" id="qnum"></div>
<img id="qimage" class="qimage" style="display:none">

<div class="options" id="options"></div>
<div class="explain" id="explain"></div>
<div class="controls">
<button class="btn" id="prev" onclick="previous()">← Previous</button>
<button class="btn next" id="next" onclick="next()">Next →</button>
</div>
</div>

<div class="card results" id="results">
<h1>Extreme Challenge Completed! 🎉</h1>
<div class="score" id="score"></div>
<div class="percent" id="percent"></div>
<div class="message" id="message"></div>
<div class="actions">
<button class="btn primary" onclick="restart()">🔄 Retake Extreme</button>
<a class="btn" href="../main.html">🏠 Return to Main Menu</a>
</div>
</div>

</div>
</main>

<script>

["Which dermal layer contains areolar connective tissue?",["Papillary layer","Reticular layer","Hypodermis","Stratum corneum"],0,"The papillary layer contains mainly areolar connective tissue."],

["Which is the longest bone in the body?",["Humerus","Femur","Tibia","Radius"],1,"The femur is the longest bone."],

["What is found in the center of an osteon?",["Central canal","Lacuna","Trabecula","Epiphyseal plate"],0,"The central canal contains blood vessels and nerves."],
["Where are osteocytes located?",["Lacunae","Central canals","Tendons","Articular cartilage"],0,"Osteocytes occupy spaces called lacunae."],
["What are canaliculi?",["Large vessels","Tiny channels connecting lacunae","Bone ends","Cartilage plates"],1,"Canaliculi connect lacunae and allow communication between osteocytes."],
["What forms the framework of spongy bone?",["Osteons only","Trabeculae","Tendons","Ligaments"],1,"Spongy bone contains a network of trabeculae."],
["What occurs in red bone marrow?",["Hematopoiesis","Keratinization","Digestion","Muscle contraction"],0,"Red bone marrow produces blood cells."],
["How many pairs of ribs are normally present?",["10","11","12","14"],2,"Humans normally have 12 pairs of ribs."],
["Which ribs are true ribs?",["1–5","1–7","8–10","11–12"],1,"Ribs 1–7 are true ribs."],
["Which ribs are floating ribs?",["1–2","7–8","8–10","11–12"],3,"Ribs 11–12 are floating ribs."],
["Which vertebra is the atlas?",["C1","C2","C7","T1"],0,"C1 is the atlas."],
["Which vertebra contains the dens?",["Atlas","Axis","C7","T12"],1,"C2, the axis, contains the dens."],
["Which vertebrae are generally the largest?",["Cervical","Thoracic","Lumbar","Coccygeal"],2,"Lumbar vertebrae are large because they support substantial body weight."],
["What is a major function of intervertebral discs?",["Produce blood","Absorb shock and allow movement","Make melanin","Attach muscle to bone"],1,"Intervertebral discs cushion vertebrae and permit controlled movement."],
["Which bone forms much of the forehead?",["Frontal","Occipital","Parietal","Temporal"],0,"The frontal bone forms the forehead."],
["Which bone forms the posterior skull?",["Frontal","Occipital","Maxilla","Mandible"],1,"The occipital bone forms the back and base of the skull."],
["Which opening allows the spinal cord through the skull?",["Foramen magnum","Optic canal","Nasal cavity","Acetabulum"],0,"The foramen magnum is the large opening in the occipital bone."],

["What is a major effect of parathyroid hormone?",["Lowers blood calcium","Raises blood calcium","Eliminates calcium","No calcium effect"],1,"Parathyroid hormone increases blood calcium."],

["Which muscle tissue is voluntary and striated?",["Smooth","Cardiac","Skeletal","Epithelial"],2,"Skeletal muscle is voluntary and striated."],
["Which muscle tissue is found in hollow organs?",["Skeletal","Smooth","Cardiac","Bone"],1,"Smooth muscle is found in many hollow organs."],
["Which muscle tissue contains intercalated discs?",["Skeletal","Smooth","Cardiac","Connective"],2,"Cardiac muscle contains intercalated discs."],
["What is the functional contractile unit of skeletal muscle?",["Sarcomere","Osteon","Neuron","Alveolus"],0,"The sarcomere is the basic contractile unit."],
["Which is the thick filament?",["Actin","Myosin","Troponin","Tropomyosin"],1,"Myosin forms the thick filament."],
["Which is the thin filament?",["Myosin","Actin","Collagen","Keratin"],1,"Actin forms the thin filament."],
["Which protein covers actin binding sites at rest?",["Troponin","Tropomyosin","Myosin","Calmodulin"],1,"Tropomyosin blocks the binding sites on actin."],
["Calcium binds to which protein?",["Troponin","Myosin","Actin","Tropomyosin"],0,"Calcium binds to troponin during contraction."],
["Which structure stores calcium in skeletal muscle?",["Sarcoplasmic reticulum","Golgi apparatus","Nucleus","Mitochondrion"],0,"The sarcoplasmic reticulum stores and releases calcium."],
["What is the main function of T-tubules?",["Store DNA","Carry action potentials deep into muscle","Produce melanin","Attach muscle to bone"],1,"T-tubules carry action potentials into the muscle fiber."],
["What makes up a skeletal muscle triad?",["One T-tubule and two terminal cisternae","Three nuclei","Three sarcomeres","Two tendons and a ligament"],0,"A triad consists of one T-tubule and two terminal cisternae."],
["Which band stays approximately the same length during contraction?",["A band","I band","H zone","Z disc"],0,"The A band remains approximately constant."],
["Which region becomes narrower?",["A band","I band","Bone matrix","Tendon"],1,"The I band narrows during contraction."],
["What can happen to the H zone during strong contraction?",["Gets wider","Can disappear","Becomes bone","Produces ATP"],1,"The H zone can become very small or disappear."],
["What allows myosin to detach from actin?",["ATP","Calcium only","Keratin","Melanin"],0,"ATP binding allows myosin to detach from actin."],
["Why does rigor mortis occur?",["Excess ATP","ATP depletion prevents detachment","No actin","Bones contract"],1,"Without ATP, myosin cannot detach from actin."],
["Which neurotransmitter is released at the neuromuscular junction?",["Acetylcholine","Insulin","Dopamine","Melatonin"],0,"Motor neurons release acetylcholine."],
["Which enzyme breaks down acetylcholine?",["Acetylcholinesterase","Pepsin","Amylase","Lipase"],0,"Acetylcholinesterase breaks down acetylcholine."],
["Which muscle primarily flexes the elbow?",["Triceps brachii","Biceps brachii","Gastrocnemius","Deltoid"],1,"The biceps brachii is an important elbow flexor."],
["Which muscle primarily extends the elbow?",["Biceps brachii","Triceps brachii","Tibialis anterior","Soleus"],1,"The triceps brachii is the major elbow extensor."],
["Which muscle initiates shoulder abduction?",["Supraspinatus","Biceps","Triceps","Gastrocnemius"],0,"The supraspinatus initiates shoulder abduction."],
["Which movement is produced by gastrocnemius?",["Dorsiflexion","Plantar flexion","Elbow extension","Wrist flexion"],1,"Gastrocnemius is a major plantar flexor."],
["Which muscle performs dorsiflexion?",["Tibialis anterior","Gastrocnemius","Biceps","Triceps"],0,"Tibialis anterior performs dorsiflexion."],
["What connects muscle to bone?",["Tendon","Ligament","Cartilage","Epidermis"],0,"Tendons connect muscle to bone."],
["What connects bone to bone?",["Tendon","Ligament","Muscle fiber","Fascia"],1,"Ligaments connect bones and stabilize joints."],

["Which epithelium has one layer of flat cells?",["Simple squamous","Simple cuboidal","Stratified cuboidal","Transitional"],0,"Simple squamous epithelium is one thin layer of flat cells."],
["Which epithelium commonly lines kidney tubules?",["Simple squamous","Simple cuboidal","Stratified squamous","Transitional"],1,"Simple cuboidal epithelium commonly lines kidney tubules."],
["Which epithelium is associated with absorption in the small intestine?",["Simple columnar","Simple squamous","Stratified cuboidal","Transitional"],0,"Simple columnar epithelium supports absorption and secretion."],
["Why does pseudostratified columnar epithelium appear multilayered?",["It has multiple layers","Nuclei lie at different heights","It contains bone","It lacks a basement membrane"],1,"Its nuclei are at different heights, but all cells contact the basement membrane."],
["Which feature is common in respiratory pseudostratified epithelium?",["Cilia and goblet cells","Keratin only","Bone matrix","Osteons"],0,"Respiratory pseudostratified columnar epithelium commonly contains cilia and goblet cells."],
["Where is keratinized stratified squamous epithelium found?",["Epidermis","Urinary bladder","Small intestine","Kidney tubules"],0,"The epidermis is keratinized stratified squamous epithelium."],
["Where is nonkeratinized stratified squamous epithelium commonly found?",["Mouth and esophagus","Epidermis","Kidney tubules","Urinary bladder"],0,"It protects moist surfaces such as the mouth and esophagus."],

["Which tissue is found in certain ducts and has multiple cuboidal layers?",["Stratified cuboidal","Simple squamous","Transitional","Pseudostratified"],0,"Stratified cuboidal epithelium can occur in gland ducts."],

["What is the main function of the basement membrane?",["Support and anchor epithelium","Produce blood","Contract muscle","Store calcium"],0,"The basement membrane supports and anchors epithelial tissue."],
["Which epithelial surface faces the lumen?",["Apical","Basal","Basement","Reticular"],0,"The apical surface faces the lumen or outside."],
["Which surface attaches to the basement membrane?",["Apical","Basal","Free","Luminal"],1,"The basal surface attaches to the basement membrane."],
["Which cell is a unicellular mucus-secreting gland?",["Goblet cell","Osteocyte","Melanocyte","Merkel cell"],0,"Goblet cells secrete mucus."],

["What distinguishes an exocrine gland?",["Uses ducts","Always produces hormones","Has no secretory cells","Produces bone"],0,"Exocrine glands use ducts."],
["Which secretion method uses exocytosis?",["Merocrine","Apocrine","Holocrine","Necrotic"],0,"Merocrine secretion uses exocytosis."],
["What happens during apocrine secretion?",["Entire cell dies","Apical portion is released","Only DNA is released","No secretion"],1,"The apical portion of the cell is released."],
["What happens during holocrine secretion?",["Entire cell disintegrates","Only nucleus is released","Apical surface stays","Cell becomes neuron"],0,"The whole secretory cell disintegrates."],

["Which junction provides strong mechanical attachment?",["Desmosome","Gap junction","Tight junction","Cilium"],0,"Desmosomes provide strong cell-to-cell attachment."],
["Which junction allows direct communication?",["Gap junction","Tight junction","Desmosome","Basement membrane"],0,"Gap junctions allow small molecules and ions to pass between cells."],
["What is the difference between simple and stratified epithelium?",["Simple has one layer; stratified has multiple","Simple has multiple; stratified has one","Simple has no cells","Stratified has no basement membrane"],0,"Simple epithelium has one layer; stratified epithelium has multiple layers."],
["Why can transitional epithelium stretch?",["Surface cells change shape","It has no cells","It is bone","It has one permanent shape"],0,"Its surface cells can change shape as the organ stretches."],
["Which image represents the four primary tissue types?",["Epithelial, connective, muscle, nervous","Bone, skin, blood, cartilage","Organ, system, organism, cell","Only epithelial tissues"],0,"The four primary tissue types are epithelial, connective, muscle and nervous tissue.","../Images/tissues_overview.png"]
];

let order=[],current=0,answers=[],score=0;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function setup(){
 order=shuffle([...Array(questions.length).keys()]);
 answers=new Array(questions.length).fill(null);
 current=0;
 score=0;

 questions.forEach(q=>{
  q.shuffled=shuffle(q[1].map((text,i)=>({text,correct:i===q[2]})));
 });

 document.getElementById("quizCard").style.display="flex";
 document.getElementById("results").classList.remove("show");
 load();
}

function load(){
 let realIndex=order[current];
 let q=questions[realIndex];

 document.getElementById("qnum").textContent=`QUESTION ${current+1} OF ${questions.length}`;
 document.getElementById("question").textContent=q[0];

 let image=document.getElementById("qimage");
 if(q[4]){
  image.src=q[4];
  image.style.display="block";
 }else{
  image.style.display="none";
  image.removeAttribute("src");
 }

 let box=document.getElementById("options");
 box.innerHTML="";

 q.shuffled.forEach((o,i)=>{
  let b=document.createElement("button");
  b.className="option";
  b.textContent=`${String.fromCharCode(65+i)}. ${o.text}`;
  b.onclick=()=>answer(i);
  box.appendChild(b);
 });

 document.getElementById("explain").classList.remove("show");
 document.getElementById("explain").textContent="";

 if(answers[current]!==null) showAnswer(answers[current]);

 document.getElementById("prev").disabled=current===0;
 document.getElementById("next").textContent=current===questions.length-1?"Finish →":"Next →";
 document.getElementById("progress").textContent=`${answers.filter(x=>x!==null).length} / ${questions.length}`;
}

function answer(i){
 if(answers[current]!==null)return;
 answers[current]=i;

 let q=questions[order[current]];
 if(q.shuffled[i].correct)score++;

 showAnswer(i);
 document.getElementById("progress").textContent=`${answers.filter(x=>x!==null).length} / ${questions.length}`;
}

function showAnswer(selected){
 let q=questions[order[current]];
 let buttons=document.querySelectorAll(".option");

 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(q.shuffled[i].correct)b.classList.add("correct");
  if(i===selected&&!q.shuffled[i].correct)b.classList.add("wrong");
 });

 let ex=document.getElementById("explain");
 ex.textContent=(q.shuffled[selected].correct?"✓ Correct! ":"✗ Incorrect. ")+q[3];
 ex.classList.add("show");
}

function next(){
 if(current<questions.length-1){
  current++;
  load();
 }else finish();
}

function previous(){
 if(current>0){
  current--;
  load();
 }
}

function finish(){
 document.getElementById("quizCard").style.display="none";
 document.getElementById("results").classList.add("show");

 let p=Math.round(score/questions.length*100);
 document.getElementById("score").textContent=`${score} / ${questions.length}`;
 document.getElementById("percent").textContent=`${p}%`;

 let msg=p>=90?" Pwede kana grumaduate beh! bigyan mo naman kami ng talino mo😭":
 p>=75?"Nakss pakopya naman sa exam!😭":
 p>=60?"Okay lang yan! buti kapa naka 60+ ako nga 25/100😭":
 "Tara Apply na tayo ng janitor sa mga mall😭";

 document.getElementById("message").textContent=msg;
}

function restart(){setup()}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")previous();
 if(e.key==="ArrowRight")next();
});

setup();
</script>
</body>
</html>
