<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extreme Anatomy & Physiology Quiz</title>

<style>
:root{
    --bg:#07111f;
    --card:#101d30;
    --card2:#14243a;
    --text:#f4f7fb;
    --muted:#9aa9bc;
    --blue:#4da3ff;
    --green:#31d17c;
    --red:#ff5c68;
    --gold:#ffd166;
    --border:#263b56;
}

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top left,#17345a 0%,transparent 35%),
        radial-gradient(circle at bottom right,#122d4a 0%,transparent 40%),
        var(--bg);
    color:var(--text);
    overflow:hidden;
}

button,a{
    font-family:inherit;
}

.header{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid var(--border);
    background:rgba(7,17,31,.75);
    backdrop-filter:blur(12px);
}

.btn-home{
    display:flex;
    align-items:center;
    gap:9px;
    text-decoration:none;
    color:white;
    background:#13263e;
    border:1px solid var(--border);
    padding:11px 17px;
    border-radius:12px;
    transition:.25s;
}

.btn-home:hover{
    transform:translateX(-3px);
    box-shadow:0 0 20px rgba(77,163,255,.25);
    border-color:var(--blue);
}

.btn-home svg{
    width:19px;
    height:19px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.badge{
    background:rgba(255,209,102,.1);
    border:1px solid rgba(255,209,102,.35);
    color:var(--gold);
    padding:8px 13px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
}

.progress{
    color:var(--muted);
    font-size:14px;
}

main{
    height:calc(100vh - 72px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.quiz{
    width:min(920px,100%);
    height:calc(100vh - 115px);
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.card{
    background:linear-gradient(145deg,var(--card),var(--card2));
    border:1px solid var(--border);
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    min-height:520px;
    display:flex;
    flex-direction:column;
}

.question-number{
    color:var(--blue);
    font-weight:bold;
    font-size:14px;
    margin-bottom:12px;
}

.question{
    font-size:26px;
    line-height:1.3;
    margin:0 0 22px;
}

.question img{
    display:block;
    max-width:100%;
    max-height:230px;
    margin:0 auto 20px;
    border-radius:14px;
    border:1px solid var(--border);
    object-fit:contain;
}

.options{
    display:grid;
    gap:12px;
    overflow:auto;
    padding-right:4px;
}

.option{
    width:100%;
    text-align:left;
    padding:15px 17px;
    background:#0d192b;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:13px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.option:hover:not(:disabled){
    transform:translateX(4px);
    border-color:var(--blue);
    background:#122640;
}

.option.correct{
    background:rgba(49,209,124,.16);
    border-color:var(--green);
    color:#aaffce;
}

.option.wrong{
    background:rgba(255,92,104,.15);
    border-color:var(--red);
    color:#ffadb4;
}

.option:disabled{
    cursor:default;
}

.explanation{
    display:none;
    margin-top:17px;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(77,163,255,.08);
    border:1px solid rgba(77,163,255,.2);
    color:#cbd9e9;
    line-height:1.5;
    font-size:14px;
}

.explanation.show{
    display:block;
}

.controls{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:20px;
}

.nav-btn,
.submit-btn,
.result-btn{
    border:1px solid var(--border);
    background:#14263d;
    color:white;
    padding:12px 19px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
    font-weight:bold;
}

.nav-btn:hover:not(:disabled),
.submit-btn:hover,
.result-btn:hover{
    transform:translateY(-2px);
    border-color:var(--blue);
    box-shadow:0 8px 25px rgba(77,163,255,.15);
}

.nav-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.submit-btn{
    background:#155d3c;
    border-color:#238c5d;
}

.results{
    display:none;
    text-align:center;
    justify-content:center;
    align-items:center;
}

.results.show{
    display:flex;
}

.results h1{
    font-size:36px;
    margin:0 0 12px;
}

.score{
    font-size:60px;
    font-weight:bold;
    color:var(--gold);
    margin:10px 0;
}

.percent{
    color:var(--blue);
    font-size:24px;
    font-weight:bold;
}

.message{
    max-width:650px;
    margin:20px auto;
    color:#c5d2e2;
    line-height:1.6;
    font-size:17px;
}

.result-actions{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.result-btn.primary{
    background:#145f9d;
    border-color:#287fca;
}

@media(max-width:650px){
    .header{
        padding:0 12px;
    }

    .badge{
        display:none;
    }

    .card{
        padding:20px;
        min-height:0;
    }

    .question{
        font-size:21px;
    }

    .option{
        font-size:14px;
    }

    .controls{
        margin-top:12px;
    }
}
</style>
</head>

<body>

<header class="header">

<a href="../main.html" class="btn-home">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<div class="header-right">

</header>

<main>

<div class="quiz">

<div class="card" id="quizCard">

← Previous

Next →

</div>

</div>


<div class="card results" id="results">

<div class="score" id="score"></div>

<div class="percent" id="percent"></div>

<div class="message" id="message"></div>

<div class="result-actions">

<button class="result-btn primary" onclick="restartQuiz()">
Retake Extreme
</button>

<a href="../main.html" class="result-btn">

</a>

</div>

</div>

</div>

</main>


<script>

const questions = [

/* =========================
   INTEGUMENTARY 1-25
========================= */

{
q:"Which is the deepest layer of the epidermis?",
o:["Stratum basale","Stratum corneum","Stratum granulosum","Stratum lucidum"],
a:0,
e:"The stratum basale is the deepest epidermal layer and contains cells that continually divide to produce new keratinocytes."
},

{
q:"Which epidermal layer is found only in thick skin?",
o:["Stratum basale","Stratum lucidum","Stratum spinosum","Stratum granulosum"],
a:1,
e:"The stratum lucidum is present in thick skin, such as the palms and soles."
},

{
q:"Which cells produce melanin?",
o:["Keratinocytes","Melanocytes","Merkel cells","Langerhans cells"],
a:1,
e:"Melanocytes produce melanin, the pigment that contributes to skin color and helps protect against ultraviolet radiation."
},

{
q:"Which receptor detects light touch in the superficial dermis?",
o:["Pacinian corpuscle","Meissner corpuscle","Osteocyte","Golgi tendon organ"],
a:1,
e:"Meissner corpuscles are specialized receptors for light touch."
},

{
q:"Which receptor is specialized for deep pressure and vibration?",
o:["Meissner corpuscle","Merkel cell","Pacinian corpuscle","Free nerve ending"],
a:2,
e:"Pacinian corpuscles detect deep pressure and vibration."
},

{
q:"Which gland produces oily sebum?",
o:["Eccrine gland","Sebaceous gland","Apocrine gland","Endocrine gland"],
a:1,
e:"Sebaceous glands produce sebum, an oily substance that helps lubricate skin and hair."
},

{
q:"Which sweat gland is most important for thermoregulation?",
o:["Eccrine gland","Sebaceous gland","Apocrine gland","Holocrine gland"],
a:0,
e:"Eccrine glands produce watery sweat that helps cool the body through evaporation."
},

{
q:"Apocrine sweat glands are especially associated with which areas?",
o:["Palms only","Axillae and anogenital regions","Scalp only","Soles only"],
a:1,
e:"Apocrine glands are concentrated in areas such as the axillae and anogenital regions."
},

{
q:"Which secretion method releases the entire cell?",
o:["Merocrine","Apocrine","Holocrine","Endocrine"],
a:2,
e:"In holocrine secretion, the entire secretory cell disintegrates and becomes part of the secretion."
},

{
q:"Which secretion method releases products by exocytosis without losing cell material?",
o:["Holocrine","Apocrine","Merocrine","Cytocrine"],
a:2,
e:"Merocrine secretion releases products through exocytosis without destroying the cell."
},

{
q:"Which protein is abundant in mature keratinocytes?",
o:["Keratin","Collagen II","Myosin","Elastin only"],
a:0,
e:"Keratinocytes produce keratin, a tough structural protein that contributes to the protective epidermal barrier."
},

{
q:"Which dermal layer contains areolar connective tissue?",
o:["Papillary layer","Reticular layer","Hypodermis","Stratum corneum"],
a:0,
e:"The papillary layer is composed mainly of areolar connective tissue."
},

{
q:"Which dermal layer is mainly dense irregular connective tissue?",
o:["Papillary layer","Reticular layer","Epidermis","Stratum lucidum"],

e:"The reticular layer is composed mainly of dense irregular connective tissue."
},

{
q:"The hypodermis commonly contains which tissues?",
o:["Only epithelial tissue","Adipose and areolar connective tissue","Only nervous tissue","Only bone"],
a:1,
e:"The hypodermis commonly contains adipose and areolar connective tissue."
},

{
q:"Which response helps generate heat when body temperature falls?",
o:["Sweating","Vasodilation","Shivering","Decreased metabolism"],
a:2,
e:"Shivering consists of rapid skeletal muscle contractions that generate heat."
},

{
q:"Which epidermal molecule is a precursor involved in vitamin D production?",
o:["7-dehydrocholesterol","Keratin","Melanin","Hemoglobin"],
a:0,
e:"7-dehydrocholesterol in the skin can be converted through ultraviolet exposure into a precursor of vitamin D."
},

{
q:"Which epidermal cells participate in immune defense?",
o:["Langerhans cells","Osteocytes","Adipocytes","Chondrocytes"],
a:0,
e:"Langerhans cells are immune-related dendritic cells found in the epidermis."
},

{
q:"Which epidermal cells are associated with light touch?",
o:["Merkel cells","Melanocytes","Langerhans cells","Fibroblasts"],
a:0,
e:"Merkel cells are specialized sensory cells associated with light touch."
},

{
q:"Why can a full-thickness burn be especially dangerous?",
o:["It only affects hair","It destroys multiple protective functions of the skin","It increases melanin production","It strengthens the epidermis"],
a:1,
e:"A full-thickness burn can destroy skin structures involved in protection, sensation, fluid balance, and thermoregulation."
},

{
q:"What is a major difference between thick and thin skin?",
o:["Thin skin has a stratum lucidum","Thick skin has a stratum lucidum and lacks hair follicles","Thick skin has no epidermis","Thin skin has no dermis"],
a:1,
e:"Thick skin has a stratum lucidum and does not contain hair follicles or sebaceous glands."
},

{
q:"What causes goosebumps?",
o:["Relaxation of skeletal muscle","Contraction of arrector pili muscles","Sweat gland destruction","Melanin release"],
a:1,
e:"Arrector pili muscles contract and pull hair follicles upright, producing goosebumps."
},

{
q:"Where does active hair growth occur?",
o:["Hair bulb and matrix","Hair shaft only","Stratum corneum","Sebaceous gland"],
a:0,
e:"The hair matrix in the hair bulb contains actively dividing cells responsible for hair growth."
},

{
q:"Which structure is responsible for nail growth?",
o:["Nail matrix","Nail plate only","Dermis only","Sebaceous gland"],
a:0,
e:"The nail matrix contains cells that divide and produce the nail plate."
},

{
q:"Which skin function helps prevent excessive water loss?",
o:["Barrier protection","Bone formation","Blood filtration","Muscle contraction"],
a:0,
e:"The epidermal barrier helps reduce water loss from the body."
},

{
q:"If melanocytes were significantly reduced, what would most directly decrease?",
o:["Melanin production","Bone density","Muscle contraction","Sweat production"],
a:0,
e:"Melanocytes are responsible for producing melanin, so reduced melanocytes mean reduced melanin production."
},


/* =========================
   SKELETAL 26-50
========================= */

{
q:"Which is the longest bone in the human body?",
o:["Humerus","Femur","Tibia","Radius"],
a:1,
e:"The femur is the longest and one of the strongest bones in the human body."
},

{
q:"What is the shaft of a long bone called?",
o:["Epiphysis","Diaphysis","Metaphysis","Periosteum"],
a:1,
e:"The diaphysis is the shaft or long central portion of a long bone."
},

{
q:"What region lies between the diaphysis and epiphysis?",
o:["Metaphysis","Foramen","Osteon","Lacuna"],
a:0,
e:"The metaphysis is the region between the shaft and the end of a long bone."
},

{
q:"Which bone cell builds new bone matrix?",
o:["Osteoclast","Osteoblast","Osteocyte","Chondrocyte"],
a:1,
e:"Osteoblasts synthesize and secrete bone matrix."
},

{
q:"Which cell breaks down bone tissue?",
o:["Osteoblast","Osteocyte","Osteoclast","Fibroblast"],
a:2,
e:"Osteoclasts resorb bone tissue."
},

{
q:"Which mature bone cell maintains the bone matrix?",
o:["Osteocyte","Osteoclast","Osteoblast","Chondroblast"],

e:"Osteocytes are mature bone cells that maintain the surrounding bone matrix."

{
q:"What is the basic structural unit of compact bone?",
o:["Trabecula","Osteon","Lacuna","Canaliculi"],

e:"The osteon, also called a Haversian system, is the basic structural unit of compact bone."

{
q:"What structure is found in the center of an osteon?",
o:["Central canal","Lacuna","Trabecula","Epiphyseal plate"],

e:"The central canal contains blood vessels and nerves and runs through the center of an osteon."
},

{
q:"Where are osteocytes located?",

e:"Osteocytes occupy small spaces called lacunae."
},

{
q:"What are canaliculi?",
o:["Large blood vessels","Tiny channels connecting lacunae","Bone ends","Cartilage plates"],
a:1,
e:"Canaliculi are tiny channels that allow communication between osteocytes in lacunae."
},

{
q:"What structures form the framework of spongy bone?",
o:["Osteons only","Trabeculae","Tendons","Ligaments"],
a:1,
e:"Spongy bone contains a network of bony trabeculae."
},

{
q:"What important process occurs in red bone marrow?",
o:["Hematopoiesis","Keratinization","Digestion","Muscle contraction"],
a:0,
e:"Red bone marrow is a major site of hematopoiesis, the production of blood cells."
},

{
q:"How many pairs of ribs are normally present?",
o:["10","11","12","14"],
a:2,
e:"Humans normally have 12 pairs of ribs, for a total of 24 ribs."
},

{
q:"Which ribs are considered true ribs?",
o:["1–5","1–7","8–10","11–12"],
a:1,
e:"Ribs 1 through 7 are true ribs because they attach directly to the sternum through their own costal cartilage."
},

{
q:"Which ribs are floating ribs?",
o:["1–2","7–8","8–10","11–12"],
a:3,
e:"Ribs 11 and 12 are floating ribs because they do not attach to the sternum."
},

{
q:"Which vertebra is called the atlas?",
o:["C1","C2","C7","T1"],
a:0,
e:"The first cervical vertebra, C1, is called the atlas."
},

{
q:"Which vertebra contains the dens?",
o:["Atlas","Axis","C7","T12"],
a:1,
e:"The axis, C2, has the dens, which helps allow rotation of the head."
},

{
q:"Which vertebrae are generally the largest?",
o:["Cervical","Thoracic","Lumbar","Coccygeal"],
a:2,
e:"Lumbar vertebrae are large because they support substantial body weight."
},

{
q:"What is a major function of intervertebral discs?",
o:["Produce red blood cells","Absorb shock and allow movement","Make melanin","Attach muscle to bone"],
a:1,
e:"Intervertebral discs provide cushioning between vertebrae and allow controlled movement."
},

{
q:"Which bone forms much of the forehead?",
o:["Frontal","Occipital","Parietal","Temporal"],
a:0,
e:"The frontal bone forms the forehead and part of the anterior skull."
},

{
q:"Which bone forms the posterior portion of the skull?",
o:["Frontal","Occipital","Maxilla","Mandible"],
a:1,
e:"The occipital bone forms the back and base of the skull."
},

{
q:"Which opening allows the spinal cord to pass through the skull?",

e:"The foramen magnum is the large opening in the occipital bone through which the spinal cord passes."

{
q:"Which joint allows much of the rotation of the head from side to side?",

a:0,
e:"The atlantoaxial joint between C1 and C2 permits significant head rotation."
},

{
q:"What type of cartilage covers the ends of bones at most synovial joints?",

e:"Articular cartilage is usually hyaline cartilage and helps reduce friction and absorb shock."
},

{
q:"What is one major effect of parathyroid hormone on blood calcium?",
o:["It lowers blood calcium","It raises blood calcium","It eliminates calcium","It has no relationship to calcium"],
a:1,
e:"Parathyroid hormone increases blood calcium levels through effects on bone, kidneys, and vitamin D activation."
},


/* =========================
   MUSCULAR 51-75
========================= */

{
q:"Which muscle tissue is voluntary and striated?",
o:["Smooth","Cardiac","Skeletal","Epithelial"],
a:2,
e:"Skeletal muscle is generally under voluntary control and has a striated appearance."
},

{
q:"Which muscle tissue is found in the walls of many hollow organs?",
o:["Skeletal","Smooth","Cardiac","Bone"],
a:1,
e:"Smooth muscle is found in structures such as the digestive tract and blood vessel walls."
},

{
q:"Which muscle tissue contains intercalated discs?",
o:["Skeletal","Smooth","Cardiac","Connective"],
a:2,
e:"Cardiac muscle cells are connected by intercalated discs."
},

q:"What is the functional contractile unit of skeletal muscle?",

e:"The sarcomere is the basic contractile unit of a skeletal muscle fiber."

q:"Which is the thick filament of a sarcomere?",

{
q:"Which is the thin filament?",
o:["Myosin","Actin","Collagen","Keratin"],

{
q:"At rest, which protein covers the myosin-binding sites on actin?",

q:"Calcium binds to which protein during skeletal muscle contraction?",

========================= */

{

/* =========================
   QUIZ ENGINE
========================= */

let current = 0;
let score = 0;
let answered = 0;
let finished = false;

const userAnswers = new Array(questions.length).fill(null);

function shuffle(array){
    const arr = [...array];

    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }

    return arr;
}

function prepareQuestions(){

    questions.forEach(q=>{

        const originalOptions = q.o.map((text,index)=>({
            text:text,
            correct:index===q.a
        }));

        q.options = shuffle(originalOptions);

    });

}

function loadQuestion(){

    const q = questions[current];

    document.getElementById("questionNumber").textContent =
        `QUESTION ${current+1} OF ${questions.length}`;

    document.getElementById("question").textContent = q.q;

    const optionsBox = document.getElementById("options");

    optionsBox.innerHTML = "";

    if(q.img){

        const img = document.createElement("img");

        img.src = q.img;
        img.alt = "Question image";

        document.getElementById("question").before(img);

    }

    // remove old image
    const oldImages =
        document.querySelectorAll("#quizCard > img");

    oldImages.forEach(img=>{
        if(!q.img || img.src !== new URL(q.img,location.href).href){
            img.remove();
        }
    });

    q.options.forEach((option,index)=>{

        const button = document.createElement("button");

        button.className = "option";
        button.textContent =
            `${String.fromCharCode(65+index)}. ${option.text}`;

        button.onclick = ()=>selectAnswer(index);

        optionsBox.appendChild(button);

    });

    const explanation =
        document.getElementById("explanation");

    explanation.classList.remove("show");
    explanation.textContent = "";

    if(userAnswers[current] !== null){

        showAnswer(userAnswers[current]);

    }

    document.getElementById("prevBtn").disabled =
        current === 0;

    document.getElementById("nextBtn").textContent =
        current === questions.length-1
        ? "Finish →"
        : "Next →";

    updateProgress();

}

function selectAnswer(index){

    if(userAnswers[current] !== null) return;

    userAnswers[current] = index;

    const q = questions[current];

    if(q.options[index].correct){
        score++;
    }

    answered++;

    showAnswer(index);

    updateProgress();

}

function showAnswer(selectedIndex){

    const q = questions[current];

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach((button,index)=>{

        button.disabled = true;

        if(q.options[index].correct){
            button.classList.add("correct");
        }

        if(index===selectedIndex &&
           !q.options[index].correct){

            button.classList.add("wrong");

        }

    });

    const explanation =
        document.getElementById("explanation");

    explanation.textContent =
        (q.options[selectedIndex].correct
        ? "✓ Correct! "
        : "✗ Incorrect. ") + q.e;

    explanation.classList.add("show");

}

function updateProgress(){

    document.getElementById("progress").textContent =
        `${answered} / ${questions.length} Answered`;

}

function nextQuestion(){

    if(current < questions.length-1){

        current++;
        loadQuestion();

    }else{

        finishQuiz();

    }

}

function previousQuestion(){

    if(current>0){

        current--;
        loadQuestion();

    }

}

function finishQuiz(){

    finished=true;

    document.getElementById("quizCard").style.display="none";

    const results =
        document.getElementById("results");

    results.classList.add("show");

    const percentage =
        Math.round((score/questions.length)*100);

    document.getElementById("score").textContent =
        `${score} / ${questions.length}`;

    document.getElementById("percent").textContent =
        `${percentage}%`;

    let message="";

    if(percentage>=90){

        message =
        "Outstanding work! 🔥 You handled the Extreme challenge very well. Keep reviewing and stay consistent, future nurse! 💙";

    }else if(percentage>=75){

        message =
        "Great job! 💪 You have a strong foundation. Review the questions you missed and keep pushing forward! 💙";

    }else if(percentage>=60){

        message =
        "Good effort! 📚 You are building your Nursing knowledge. Review the explanations and try the Extreme challenge again! 💙";

    }else{

        message =
        "Don't give up! 🌱 Every mistake is another opportunity to learn. Review your weak topics, practice again, and keep going, future nurse! 💙";

    }

    document.getElementById("message").textContent =
        message;

}

function restartQuiz(){

    current=0;
    score=0;
    answered=0;
    finished=false;

    userAnswers.fill(null);

    document.getElementById("results")
        .classList.remove("show");

    document.getElementById("quizCard")
        .style.display="flex";

    prepareQuestions();
    loadQuestion();

}

document.addEventListener("keydown",(event)=>{

    if(finished) return;

    if(event.key==="ArrowLeft"){

        previousQuestion();

    }

    if(event.key==="ArrowRight"){

        nextQuestion();

    }

});


/* START */

prepareQuestions();
loadQuestion();

</script>
