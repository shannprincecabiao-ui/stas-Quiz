<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Level - Practice Exam Reviewer Prelim Nursing Anaphy 1st year</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-home {
            background-color: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: var(--accent-blue);
            color: #0f172a;
        }

        .status-tracker {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .badge-difficulty {
            background: rgba(74, 222, 128, 0.15);
            color: var(--accent-green);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(74, 222, 128, 0.3);
            font-size: 0.85rem;
        }

        .progress-text {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Slide View Container */
        .quiz-slide-wrapper {
            position: relative;
            min-height: 480px;
        }

        .quiz-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .quiz-card.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            color: var(--accent-blue);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .diagram-img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 0.5rem auto 1.2rem auto;
            display: block;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.85rem 1rem;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not([disabled]) {
            background: var(--card-hover);
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background-color: rgba(74, 222, 128, 0.2) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: rgba(248, 113, 113, 0.2) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red) !important;
        }

        .explanation {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border-left: 4px solid var(--accent-blue);
            border-radius: 4px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: none;
        }

        /* Navigation Controls */
        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover:not([disabled]) {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-submit-action {
            background: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit-action:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Results Card */
        .results-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .results-card h2 {
            font-size: 2rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-green);
            margin: 1rem 0;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn-retake {
            background-color: var(--accent-green);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-retake:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .quote-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #0f172a;
            border-radius: 12px;
            border: 1px dashed var(--accent-blue);
            color: var(--text-secondary);
            font-style: italic;
            line-height: 1.6;
        }

        .quote-author {
            margin-top: 0.5rem;
            font-style: normal;
            font-weight: 700;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header & Nav -->
        <div class="header-nav">
            <a href="../main.html" class="btn-home">← Go back home</a>
            <div class="status-tracker">
                <span class="progress-text" id="progress-counter">0 / 75 Answered</span>
                <span class="badge-difficulty">Level: Easy</span>
            </div>
        </div>

        <!-- Single Card Slide Wrapper -->
        <div class="quiz-slide-wrapper" id="quiz-container"></div>

        <!-- Navigation & Actions Controls -->
        <div class="controls-wrapper" id="controls-panel">
            <button class="nav-btn" id="prev-btn" onclick="navigateSlide(-1)">← Previous</button>
            <button class="btn-submit-action" id="submit-btn" onclick="calculateScore()">Submit Practice Exam</button>
            <button class="nav-btn" id="next-btn" onclick="navigateSlide(1)">Next →</button>
        </div>

        <!-- Final Score Card -->
        <div id="results-card" class="results-card">
            <h2>Exam Completed!</h2>
            <p style="color: var(--text-secondary);">Practice Exam Reviewer Prelim Nursing Anaphy 1st year</p>
            <div class="score-display" id="score-text">0 / 75</div>
            <p id="percentage-text" style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem;"></p>
            
            <div class="action-buttons">
                <button class="btn-retake" onclick="resetQuiz()">Retake Quiz (Shuffled Order)</button>
                <a href="../main.html" class="btn-home" style="padding: 0.75rem 1.5rem; font-size: 1rem;">Return to Main Menu</a>
            </div>

            <div class="quote-box">
                "The trained nurse has become one of the great blessings of humanity, taking a place beside the physician and the priest."
                <div class="quote-author">— William Osler</div>
            </div>
        </div>

    </div>

    <script>
        const rawQuizData = [
            // --- INTRODUCTION TO ANATOMY ---
            {
                q: "Referring to the body planes diagram, which anatomical plane is indicated by label #1?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/body_planes.png",

                correctText: "Sagittal plane",
                exp: "Label #1 marks the sagittal plane, which divides the body vertically into right and left portions."
            },
            {
                q: "Referring to the body planes diagram, which anatomical plane is indicated by label #2?",

                correctText: "Frontal (Coronal) plane",

            },
            {
                q: "Referring to the body planes diagram, which anatomical plane is indicated by label #3?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/body_planes.png",

                correctText: "Transverse plane",
                exp: "Label #3 indicates the transverse (horizontal) plane, dividing upper and lower sections."
            },
            {
                q: "In anatomical directional terms, the elbow is considered _____ to the wrist.",
                options: ["Distal", "Proximal", "Inferior", "Lateral"],
                correctText: "Proximal",
                exp: "Proximal means closer to the point of trunk attachment."
            },
            {
                q: "What term describes a structure that is closer to the head or higher than another structure?",
                options: ["Inferior", "Anterior", "Superior", "Posterior"],
                correctText: "Superior",
                exp: "Superior refers to a location toward the head or higher up."
            },
            {
                q: "The anatomical term 'Anterior' refers to which direction?",
                options: ["Toward the back of the body", "Toward the front of the body", "Toward the midline", "Away from the surface"],
                correctText: "Toward the front of the body",
                exp: "Anterior (ventral) means toward the front surface of the body."
            },
            {
                q: "The heart is located _____ to the lungs.",
                options: ["Lateral", "Medial", "Distal", "Superior"],
                correctText: "Medial",
                exp: "Medial means located nearer to the midline."
            },
            {
                q: "The skin is located _____ compared to the skeletal muscles.",
                options: ["Deep", "Superficial", "Proximal", "Inferior"],
                correctText: "Superficial",
                exp: "Superficial means situated near or on the surface."
            },
            {
                q: "In anatomical position, the palms of the hands are facing in which direction?",
                options: ["Posteriorly", "Medially", "Anteriorly", "Inferiorly"],
                correctText: "Anteriorly",
                exp: "Anatomical position requires palms facing forward (anteriorly)."
            },
            {
                q: "Which body cavity contains the brain?",
                options: ["Thoracic cavity", "Abdominal cavity", "Cranial cavity", "Vertebral cavity"],
                correctText: "Cranial cavity",
                exp: "The cranial cavity houses and protects the brain."
            },

            // --- CELL STRUCTURE ---
            {
                q: "Referring to the cell structure diagram, which organelle is indicated by label #1?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/cell_structure.png",
                options: ["Nucleus", "Mitochondria", "Golgi apparatus", "Ribosome"],
                correctText: "Nucleus",
                exp: "Label #1 indicates the nucleus, the genetic control center of the cell."
            },
            {
                q: "Referring to the cell structure diagram, which organelle is indicated by label #2?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/cell_structure.png",
                options: ["Mitochondria", "Golgi apparatus", "Plasma Membrane", "Endoplasmic Reticulum"],
                correctText: "Mitochondria",
                exp: "Label #2 identifies the mitochondria, generating cellular ATP."
            },
            {
                q: "Referring to the cell structure diagram, which cellular boundary is indicated by label #3?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/cell_structure.png",
                options: ["Cell Wall", "Plasma Membrane", "Nuclear Envelope", "Endoplasmic Reticulum"],
                correctText: "Plasma Membrane",
                exp: "Label #3 points to the plasma membrane surrounding the cell contents."
            },
            {
                q: "Referring to the cell structure diagram, which organelle is indicated by label #4?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/cell_structure.png",
                options: ["Golgi apparatus", "Rough ER", "Mitochondria", "Centriole"],
                correctText: "Golgi apparatus",
                exp: "Label #4 shows the Golgi apparatus responsible for sorting and packaging proteins."
            },
            {
                q: "Which organelle is responsible for synthesizing proteins?",
                options: ["Ribosome", "Smooth ER", "Lysosome", "Peroxisome"],
                correctText: "Ribosome",
                exp: "Ribosomes translate genetic codes to synthesize proteins."
            },
            {
                q: "Lysosomes are primarily responsible for which cellular function?",
                options: ["Protein synthesis", "Waste digestion and breakdown", "ATP production", "Lipid synthesis"],
                correctText: "Waste digestion and breakdown",
                exp: "Lysosomes digest foreign materials and cellular waste."
            },
            {
                q: "What type of transport mechanism requires ATP energy to move particles against their concentration gradient?",
                options: ["Simple Diffusion", "Facilitated Diffusion", "Osmosis", "Active Transport"],
                correctText: "Active Transport",
                exp: "Active transport requires metabolic energy (ATP)."
            },
            {
                q: "Osmosis refers specifically to the diffusion of which substance across a membrane?",
                options: ["Glucose", "Sodium ions", "Water", "Oxygen"],
                correctText: "Water",
                exp: "Osmosis is water movement across a semipermeable membrane."
            },
            {
                q: "Which structure in the cell nucleus is the site of ribosome subunit assembly?",
                options: ["Nucleolus", "Chromatin", "Nuclear Pore", "Centrosome"],
                correctText: "Nucleolus",
                exp: "The nucleolus synthesizes ribosomal RNA."
            },
            {
                q: "The Smooth Endoplasmic Reticulum is primarily involved in the synthesis of:",
                options: ["Proteins", "Lipids and Steroids", "Nucleic Acids", "Carbohydrates"],
                correctText: "Lipids and Steroids",
                exp: "Smooth ER specializes in lipid and hormone production."
            },

            // --- TISSUES OVERVIEW ---
            {
                q: "Referring to the tissues overview diagram, which primary tissue type is indicated by label #1?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/tissues_overview.png",
                options: ["Epithelial tissue", "Connective tissue", "Muscle tissue", "Nervous tissue"],
                correctText: "Epithelial tissue",
                exp: "Label #1 shows epithelial tissue covering internal and external surfaces."
            },
            {
                q: "Referring to the tissues overview diagram, which primary tissue type is indicated by label #2?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/tissues_overview.png",
                options: ["Epithelial tissue", "Connective tissue", "Muscle tissue", "Nervous tissue"],
                correctText: "Connective tissue",
                exp: "Label #2 identifies connective tissue providing structural support."
            },
            {
                q: "Referring to the tissues overview diagram, which primary tissue type is indicated by label #3?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/tissues_overview.png",
                options: ["Muscle tissue", "Nervous tissue", "Epithelial tissue", "Connective tissue"],
                correctText: "Muscle tissue",
                exp: "Label #3 represents muscle tissue designed for contraction."
            },
            {
                q: "Referring to the tissues overview diagram, which primary tissue type is indicated by label #4?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/tissues_overview.png",
                options: ["Nervous tissue", "Epithelial tissue", "Connective tissue", "Muscle tissue"],
                correctText: "Nervous tissue",
                exp: "Label #4 highlights nervous tissue specialized in electrical impulses."
            },
            {
                q: "Blood, bone, and cartilage are classified under which major tissue category?",
                options: ["Epithelial tissue", "Connective tissue", "Muscular tissue", "Nervous tissue"],
                correctText: "Connective tissue",
                exp: "All three possess extracellular matrix and belong to connective tissues."
            },
            {
                q: "What type of muscle tissue is striated and under voluntary control?",
                options: ["Smooth muscle", "Skeletal muscle", "Cardiac muscle", "Visceral muscle"],
                correctText: "Skeletal muscle",
                exp: "Skeletal muscle is voluntary and features visible striations."
            },
            {
                q: "Which type of muscle tissue is found exclusively in the walls of the heart?",
                options: ["Skeletal muscle", "Smooth muscle", "Cardiac muscle", "Involuntary smooth muscle"],
                correctText: "Cardiac muscle",
                exp: "Cardiac muscle makes up the contractile heart wall."
            },
            {
                q: "Simple squamous epithelium consists of how many layers of cells?",
                options: ["A single layer of flattened cells", "Multiple layers of cuboidal cells", "A single layer of tall cells", "Multiple layers of flat cells"],
                correctText: "A single layer of flattened cells",
                exp: "Simple squamous denotes one layer of flat, scale-like cells."
            },
            {
                q: "What specialized epithelial cell type produces and secretes mucus?",
                options: ["Keratinocyte", "Goblet cell", "Fibroblast", "Chondrocyte"],
                correctText: "Goblet cell",
                exp: "Goblet cells secrete protective mucus along mucous membranes."
            },
            {
                q: "Which cell type is responsible for producing collagen fibers in dense connective tissue?",
                options: ["Fibroblast", "Osteocyte", "Chondrocyte", "Adipocyte"],
                correctText: "Fibroblast",
                exp: "Fibroblasts generate fiber matrix elements in connective tissue."
            },

            // --- SKIN LAYERS ---
            {
                q: "Referring to the skin layers diagram, which skin layer is indicated by label #1?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/skin_layers.png",
                options: ["Epidermis", "Dermis", "Hypodermis", "Subcutaneous layer"],
                correctText: "Epidermis",
                exp: "Label #1 marks the superficial epidermis layer."
            },
            {
                q: "Referring to the skin layers diagram, which skin layer is indicated by label #2?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/skin_layers.png",
                options: ["Stratum corneum", "Dermis", "Hypodermis", "Subcutis"],
                correctText: "Dermis",
                exp: "Label #2 represents the vascular dermis layer beneath the epidermis."
            },
            {
                q: "Referring to the skin layers diagram, which skin layer is indicated by label #3?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/skin_layers.png",

                exp: "Label #3 marks the hypodermis containing adipose tissue."
            },
            {
                q: "Referring to the skin layers diagram, which structure is indicated by label #4?",
                img: "https://shannprincecabiao-ui.github.io/stas-Quiz/Images/skin_layers.png",

                correctText: "Arrector pili muscle",
                exp: "Label #4 marks the arrector pili muscle that causes goosebumps."

            {
                q: "Which pigment is primarily responsible for human skin and hair color?",
                options: ["Keratin", "Melanin", "Hemoglobin", "Carotene"],
                correctText: "Melanin",

            },
            {
                q: "Sebaceous glands secrete an oily substance called:",
                options: ["Sweat", "Sebum", "Cerumen", "Keratin"],
                correctText: "Sebum",
                exp: "Sebaceous glands produce oil (sebum)."
            },
            {
                q: "What tough, fibrous protein fills dead skin cells in the stratum corneum to make skin water-resistant?",

                correctText: "Keratin",
                exp: "Keratin hardens cells making skin tough and water-resistant."

            {
                q: "Sweat glands responsible for body temperature regulation throughout most of the body are:",

                exp: "Eccrine sweat glands cool the body via evaporation."
            },
            {
                q: "Which stratum layer of the epidermis undergoes constant mitosis to replace lost surface cells?",
                options: ["Stratum corneum", "Stratum lucidum", "Stratum basale", "Stratum granulosum"],

                exp: "Stratum basale is the deepest actively dividing epidermal layer."
            },
            {
                q: "Which epidermal stratum is present ONLY in thick skin (such as palms and soles)?",
                options: ["Stratum spinosum", "Stratum lucidum", "Stratum basale", "Stratum corneum"],
                correctText: "Stratum lucidum",
                exp: "Stratum lucidum is exclusive to thick hairless skin."
            },

            // --- SKELETAL OVERVIEW ---

                q: "Referring to the skeletal overview diagram, which skeletal region is indicated by label #1?",

                correctText: "Axial skeleton",
                exp: "Label #1 highlights the central axial skeleton (skull, ribs, spine)."

            {
                q: "Referring to the skeletal overview diagram, which bone is indicated by label #2?",

                correctText: "Clavicle",

            {

                correctText: "Humerus",
                exp: "Label #3 marks the humerus of the arm."

            {
                q: "Referring to the skeletal overview diagram, which bone is indicated by label #4?",

                correctText: "Femur",

            {
                q: "How many total bones make up the adult human skeleton?",
                options: ["206", "300", "126", "80"],

            {
                q: "The bone cells responsible for breaking down bone tissue during remodeling are:",
                options: ["Osteoblasts", "Osteocytes", "Osteoclasts", "Osteogenic cells"],

                exp: "Osteoclasts resorb and break down bone matrix."
            },
            {
                q: "Bone-forming cells that secrete bone matrix are called:",
                options: ["Osteoblasts", "Osteoclasts", "Osteocytes", "Chondrocytes"],
                correctText: "Osteoblasts",
                exp: "Osteoblasts deposit bone tissue matrix."

        let activeQuizData = [];
        let userAnswers = {};
        let currentSlide = 0;
        let isSubmitted = false;

        // Fisher-Yates Array Shuffle
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Prepare Shuffled Quiz Data
        function prepareShuffledQuiz() {
            let shuffledQuestions = shuffleArray(rawQuizData);

            activeQuizData = shuffledQuestions.map(item => {
                let shuffledOpts = shuffleArray(item.options);
                let newCorrectIndex = shuffledOpts.indexOf(item.correctText);

                return {
                    q: item.q,
                    img: item.img,
                    options: shuffledOpts,
                    correct: newCorrectIndex,
                    exp: item.exp
                };
            });
        }

        // Render Slide Deck
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            container.innerHTML = '';
            userAnswers = {};
            currentSlide = 0;
            isSubmitted = false;

            activeQuizData.forEach((data, index) => {
                // Render Slide Card
                const card = document.createElement('div');
                card.className = `quiz-card ${index === 0 ? 'active' : ''}`;
                card.id = `card-${index}`;

                let imgHTML = data.img ? `<img src="${data.img}" alt="Diagram Question ${index + 1}" class="diagram-img">` : '';

                let optionsHTML = data.options.map((opt, optIndex) => `
                    <button class="option-btn" onclick="selectOption(${index}, ${optIndex}, this)">
                        ${String.fromCharCode(65 + optIndex)}. ${opt}
                    </button>
                `).join('');

                card.innerHTML = `
                    <div class="question-number">Question ${index + 1} of ${activeQuizData.length}</div>
                    <div class="question-text">${data.q}</div>
                    ${imgHTML}
                    <div class="options-container" id="options-${index}">
                        ${optionsHTML}
                    </div>
                    <div class="explanation" id="explanation-${index}">
                        <strong>Explanation:</strong> ${data.exp}
                    </div>
                `;
                container.appendChild(card);
            });

            updateSlideUI();
            updateProgressTracker();
        }

        function selectOption(qIndex, optIndex, selectedBtn) {
            // Prevent changing selection once answered or submitted
            if (userAnswers.hasOwnProperty(qIndex) || isSubmitted) return;

            userAnswers[qIndex] = optIndex;
            const data = activeQuizData[qIndex];
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            const explanationDiv = document.getElementById(`explanation-${qIndex}`);

            // Lock all option buttons for this question
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;

                // Highlight correct option in green
                if (i === data.correct) {
                    buttons[i].classList.add('correct');
                }

                // Highlight selected wrong option in red
                if (optIndex === i && optIndex !== data.correct) {
                    buttons[i].classList.add('incorrect');
                }
            }

            // Reveal explanation immediately
            explanationDiv.style.display = 'block';

            updateProgressTracker();
        }

        function updateProgressTracker() {
            const answeredCount = Object.keys(userAnswers).length;
            document.getElementById('progress-counter').innerText = `${answeredCount} / ${activeQuizData.length} Answered`;
        }

        function navigateSlide(direction) {
            const newIndex = currentSlide + direction;
            if (newIndex >= 0 && newIndex < activeQuizData.length) {
                jumpToSlide(newIndex);
            }
        }

        function jumpToSlide(index) {
            document.getElementById(`card-${currentSlide}`).classList.remove('active');
            currentSlide = index;
            document.getElementById(`card-${currentSlide}`).classList.add('active');

            updateSlideUI();
        }

        function updateSlideUI() {
            document.getElementById('prev-btn').disabled = (currentSlide === 0);
            document.getElementById('next-btn').disabled = (currentSlide === activeQuizData.length - 1);
        }

        // Keyboard Arrow Shortcuts for Slide Navigation
        document.addEventListener('keydown', (e) => {
            if (isSubmitted) return;
            if (e.key === 'ArrowLeft') {
                navigateSlide(-1);
            } else if (e.key === 'ArrowRight') {
                navigateSlide(1);
            }
        });

        function calculateScore() {
            isSubmitted = true;
            let score = 0;

            activeQuizData.forEach((data, index) => {
                const selected = userAnswers[index];
                if (selected === data.correct) {
                    score++;
                }
            });

            // Hide Quiz Deck Controls, Show Final Score Card
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('controls-panel').style.display = 'none';

            const resultsCard = document.getElementById('results-card');
            resultsCard.style.display = 'block';

            document.getElementById('score-text').innerText = `${score} / ${activeQuizData.length}`;
            const percentage = Math.round((score / activeQuizData.length) * 100);
            document.getElementById('percentage-text').innerText = `Your Score: ${percentage}%`;
        }

        function resetQuiz() {
            document.getElementById('results-card').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('controls-panel').style.display = 'flex';

            prepareShuffledQuiz();
            renderQuiz();
        }

        // Initialize on page load
        prepareShuffledQuiz();
        renderQuiz();
    </script>
