                options: ["Flexor digitorum superficialis", "Extensor digitorum", "Extensor indicis", "Abductor pollicis longus"],
                answer: 1,
                rationale: "Extensor digitorum originates on the lateral epicondyle and extends the fingers and wrist."
            },
            {
                topic: "Appendicular Muscles",
                question: "Which deep pelvic muscle exits through the greater sciatic notch and can cause sciatic nerve compression when tight?",
                options: ["Piriformis", "Gluteus minimus", "Quadratus femoris", "Obturator internus"],
                answer: 0,
                rationale: "The piriformis runs near the sciatic nerve; spasm or tightness leads to piriformis syndrome (sciatic pain)."
            }
        ];

        // Render Questions
        function renderQuiz() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            examData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.id = `q-card-${index}`;

                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">Question ${index + 1} of 100</span>
                        <span class="q-topic">${item.topic}</span>
                    </div>
                    <div class="q-text">${item.question}</div>
                    <div class="options-list">
                        ${item.options.map((opt, oIdx) => `
                            <label class="option-label">
                                <input type="radio" name="q${index}" value="${oIdx}" onchange="updateProgress()">
                                ${opt}
                            </label>
                        `).join('')}
                    </div>
                    <div class="rationale" id="rationale-${index}"></div>
                `;
                container.appendChild(card);
            });
        }

        // Live Tracker update
        function updateProgress() {
            const formData = new FormData(document.getElementById('quiz-form'));
            let answered = 0;
            for (let i = 0; i < examData.length; i++) {
                if (formData.has(`q${i}`)) {
                    answered++;
                }
            }
            document.getElementById('answered-count').innerText = answered;
        }

        // Grade Exam and display rationales
        function gradeExam() {
            const formData = new FormData(document.getElementById('quiz-form'));
            let score = 0;

            examData.forEach((item, index) => {
                const card = document.getElementById(`q-card-${index}`);
                const rationaleDiv = document.getElementById(`rationale-${index}`);
                const selected = formData.get(`q${index}`);

                // Remove old classes
                card.classList.remove('correct-card', 'incorrect-card');
                rationaleDiv.classList.remove('visible', 'correct', 'incorrect');

                if (selected !== null) {
                    const selIdx = parseInt(selected);
                    if (selIdx === item.answer) {
                        score++;
                        card.classList.add('correct-card');
                        rationaleDiv.classList.add('visible', 'correct');
                        rationaleDiv.innerHTML = `<strong>✓ Correct!</strong><br>${item.rationale}`;
                    } else {
                        card.classList.add('incorrect-card');
                        rationaleDiv.classList.add('visible', 'incorrect');
                        rationaleDiv.innerHTML = `<strong>✗ Incorrect.</strong> Correct Answer: <strong>${item.options[item.answer]}</strong><br>${item.rationale}`;
                    }
                } else {
                    card.classList.add('incorrect-card');
                    rationaleDiv.classList.add('visible', 'incorrect');
                    rationaleDiv.innerHTML = `<strong>! Unanswered.</strong> Correct Answer: <strong>${item.options[item.answer]}</strong><br>${item.rationale}`;
                }
            });

            // Update top bar score & display overall summary
            document.getElementById('current-score').innerText = `${score} / 100`;
            const percentage = Math.round((score / 100) * 100);
            
            const banner = document.getElementById('results-banner');
            const bannerText = document.getElementById('final-score-text');
            bannerText.innerText = `Your Final Score: ${score} / 100 (${percentage}%)`;
            banner.classList.add('visible');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize on load
        window.onload = renderQuiz;
    </script>
</body>
</html>
