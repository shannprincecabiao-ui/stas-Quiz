<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prelim Nursing Anaphy - Interactive Exam Reviewer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* --- UPGRADED HOME BUTTON STYLES --- */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(56, 189, 248, 0.05));
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 0.55rem 1.1rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.3px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-home svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.25s ease;
        }

        .btn-home:hover {
            background: var(--accent-blue);
            color: #0f172a;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .btn-home:hover svg {
            transform: translateX(-3px);
        }

        .btn-home:active {
            transform: translateY(0);
            box-shadow: 0 0 5px rgba(56, 189, 248, 0.3);
        }

        .status-tracker {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .badge-difficulty {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 0.85rem;
        }

        .progress-text {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .quiz-slide-wrapper {
            position: relative;
            min-height: 520px;
        }

        .quiz-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .quiz-card.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            color: var(--accent-blue);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .diagram-img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 0.5rem auto 1rem auto;
            display: block;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .option-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not([disabled]) {
            background: var(--card-hover);
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background-color: rgba(74, 222, 128, 0.2) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: rgba(248, 113, 113, 0.2) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red) !important;
        }

        .explanation {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border-left: 4px solid var(--accent-blue);
            border-radius: 4px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: none;
        }

        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1.25rem;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover:not([disabled]) {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-submit-action {
            background: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit-action:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .results-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .results-card h2 {
            font-size: 2rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-green);
            margin: 1rem 0;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn-retake {
            background-color: var(--accent-green);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-retake:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }

        .quote-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #0f172a;
            border-radius: 12px;
            border: 1px dashed var(--accent-blue);
            color: var(--text-secondary);
            font-style: italic;
            line-height: 1.6;
        }

        .quote-author {
            margin-top: 0.5rem;
            font-style: normal;
            font-weight: 700;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header Nav with Fixed and Enhanced Return Link -->
        <div class="header-nav">
            <a href="../main.html" class="btn-home">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>Return to Main</span>
            </a>
            <div class="status-tracker">
                <span class="progress-text" id="progress-counter">0 / 100 Answered</span>
                <span class="badge-difficulty">100 Items</span>
            </div>
        </div>

        <!-- Single Card Slide Wrapper -->
        <div class="quiz-slide-wrapper" id="quiz-container"></div>

        <!-- Navigation Controls -->
        <div class="controls-wrapper" id="controls-panel">
            <button class="nav-btn" id="prev-btn" onclick="navigateSlide(-1)">← Previous</button>
            <button class="btn-submit-action" id="submit-btn" onclick="calculateScore()">Submit Exam</button>
            <button class="nav-btn" id="next-btn" onclick="navigateSlide(1)">Next →</button>
        </div>

        <!-- Final Score Card -->
        <div id="results-card" class="results-card">
            <h2>Exam Completed!</h2>
            <p style="color: var(--text-secondary);">Prelim Nursing Anatomy & Physiology Reviewer</p>
            <div class="score-display" id="score-text">0 / 100</div>
            <p id="percentage-text" style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem;"></p>
            
            <div class="action-buttons">
                <button class="btn-retake" onclick="resetQuiz()">Retake Exam (Shuffled)</button>
                <a href="../main.html" class="btn-home" style="padding: 0.75rem 1.5rem; font-size: 0.95rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    <span>Return to Main Menu</span>
                </a>
            </div>

            <div class="quote-box">
                "The trained nurse has become one of the great blessings of humanity, taking a place beside the physician and the priest."
                <div class="quote-author">— William Osler</div>
            </div>
        </div>

    </div>

    <script>
        const rawQuizData = [
            // --- EPITHELIUM (IMAGE QUESTIONS) ---
            {
                q: "Identify the tissue type shown in the image below:",
                img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvzdbErTL7kU5JBUfSqPYiLQU_Tfi2rcXpdj5xBGnFmA&s=10",
                options: ["Simple Cuboidal Epithelium", "Simple Squamous Epithelium", "Stratified Columnar Epithelium", "Transitional Epithelium"],
                correctText: "Simple Cuboidal Epithelium",
                exp: "Simple cuboidal epithelium consists of a single layer of cube-like cells commonly found in kidney tubules and glands."
            },
            {
                q: "Identify the tissue type shown in the image below:",
                img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2v11MTNOV70cL8SOJmCTBLx0D2Y9cwRFwKTIyvAs-qs0rdL5JIdXxlvpH&s=10",
                options: ["Simple Columnar Epithelium", "Simple Cuboidal Epithelium", "Stratified Squamous Epithelium", "Transitional Epithelium"],
                correctText: "Simple Columnar Epithelium",
                exp: "Simple columnar epithelium features a single layer of tall, column-shaped cells, ideal for absorption and secretion in the GI tract."
            },
            {
                q: "Identify the specialized tissue type shown in the image below:",
                img: "https://vmicro.iusm.iu.edu/hs_vm/images/epi9_kerat.jpg",
                options: ["Ciliated Simple Columnar Epithelium", "Simple Squamous Epithelium", "Transitional Epithelium", "Stratified Columnar Epithelium"],
                correctText: "Ciliated Simple Columnar Epithelium",
                exp: "Ciliated simple columnar epithelium features hair-like cilia projections that help move mucus or cells along respiratory/reproductive tracts."
            },
            {
                q: "Identify the tissue type shown in the urinary bladder light micrograph:",
                img: "https://media.sciencephoto.com/image/c0477812/800wm/C0477812-Urinary_bladder_transitional_epithelium,_light_micrograph.jpg",
                options: ["Transitional Epithelium", "Simple Cuboidal Epithelium", "Stratified Columnar Epithelium", "Simple Squamous Epithelium"],
                correctText: "Transitional Epithelium",
                exp: "Transitional epithelium is a specialized stratified epithelium capable of stretching to accommodate fluid volume changes in the urinary system."
            },
            {
                q: "Identify the multi-layered tissue type shown in the image below:",
                img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLc9hQsn5bCqOj1Wh9Wtvq0XCqagrGQaBe2X6DxOIEsg&s=10",
                options: ["Stratified Columnar Epithelium", "Simple Columnar Epithelium", "Simple Cuboidal Epithelium", "Transitional Epithelium"],
                correctText: "Stratified Columnar Epithelium",
                exp: "Stratified columnar epithelium features multiple layers of cells where the apical layer consists of columnar cells."
            },
            {
                q: "Identify the protective skin/mucosa tissue type shown in the image below:",
                img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3oulHGdHJueZ7nsHnJb8pawsT1XT_BFPuYHyW6IcqtfJHweyKuS1Z7X2n&s=10",
                options: ["Stratified Squamous Epithelium", "Simple Squamous Epithelium", "Simple Cuboidal Epithelium", "Transitional Epithelium"],
                correctText: "Stratified Squamous Epithelium",
                exp: "Stratified squamous epithelium consists of multiple cell layers designed to protect underlying tissues from abrasion."
            },
            {
                q: "Identify the single-layer flattened tissue type shown in the image below:",
                img: "https://i0.wp.com/kitng.me/wp-content/uploads/2016/08/untitled-shoot-2959.jpg?fit=1200%2C797&ssl=1",
                options: ["Simple Squamous Epithelium", "Simple Cuboidal Epithelium", "Stratified Squamous Epithelium", "Simple Columnar Epithelium"],
                correctText: "Simple Squamous Epithelium",
                exp: "Simple squamous epithelium consists of a single layer of flattened cells, enabling rapid diffusion and filtration."
            },

            // --- ANATOMY & PHYSIOLOGY CONTENT ---
            {
                q: "Which layer of the epidermis is only found in thick skin such as the palms of the hands and soles of the feet?",
                options: ["Stratum basale", "Stratum spinosum", "Stratum lucidum", "Stratum granulosum"],
                correctText: "Stratum lucidum",
                exp: "Stratum lucidum is a clear layer of dead keratinocytes found exclusively in thick skin."
            },
            {
                q: "Which cells in the epidermis serve as sensory receptors for touch?",
                options: ["Langerhans cells", "Merkel cells", "Keratinocytes", "Melanocytes"],
                correctText: "Merkel cells",
                exp: "Merkel cells associate with nerve endings in the stratum basale to detect light touch."
            },
            {
                q: "What is the primary function of Langerhans cells in the stratum spinosum?",
                options: ["Melanin synthesis", "Immune defense via antigen presentation", "Keratin production", "Lipid secretion"],
                correctText: "Immune defense via antigen presentation",
                exp: "Langerhans cells act as specialized macrophages in the skin's immune response."
            },
            {
                q: "Which layer of the dermis accounts for approximately 80% of dermal thickness and contains dense irregular connective tissue?",
                options: ["Papillary layer", "Reticular layer", "Stratum basale", "Subcutaneous layer"],
                correctText: "Reticular layer",
                exp: "The reticular layer is the deeper dermal layer rich in collagen and elastic fibers."
            },
            {
                q: "Sebaceous glands release their oily secretion (sebum) primarily through which mechanism?",
                options: ["Merocrine secretion", "Apocrine secretion", "Holocrine secretion", "Endocrine secretion"],
                correctText: "Holocrine secretion",
                exp: "In holocrine secretion, whole cells rupture to release oily sebum."
            },
            {
                q: "Eccrine sweat glands are classified functionally as which type of gland?",
                options: ["Holocrine", "Merocrine", "Apocrine", "Sebaceous"],
                correctText: "Merocrine",
                exp: "Eccrine glands secrete sweat via exocytosis (merocrine secretion) for cooling."
            },
            {
                q: "Apocrine sweat glands are located predominantly in which region?",
                options: ["Forehead and palms", "Axillary and anogenital regions", "Soles of feet and face", "Mucous membranes"],
                correctText: "Axillary and anogenital regions",
                exp: "Apocrine glands are concentrated in armpit and groin regions."
            },
            {
                q: "The crescent-shaped white area at the proximal end of the nail body is called the:",
                options: ["Eponychium", "Hyponychium", "Lunula", "Nail matrix"],
                correctText: "Lunula",
                exp: "The lunula is the pale crescent area at the base of the nail."
            },
            {
                q: "Which protein provides structural strength and waterproofing to superficial epidermal layers?",
                options: ["Collagen", "Elastin", "Keratin", "Actin"],
                correctText: "Keratin",
                exp: "Keratin hardens epidermal cells to make the skin waterproof and tough."
            },
            {
                q: "What pigment produced by melanocytes absorbs harmful ultraviolet (UV) radiation?",
                options: ["Carotene", "Hemoglobin", "Melanin", "Bilirubin"],
                correctText: "Melanin",
                exp: "Melanin shields cellular DNA against UV radiation."
            },
            {
                q: "Which dermal papillae structures contain nerve endings for light touch?",
                options: ["Meissner's corpuscles", "Pacinian corpuscles", "Ruffini endings", "Hair roots"],
                correctText: "Meissner's corpuscles",
                exp: "Meissner's corpuscles in dermal papillae detect tactile touch."
            },
            {
                q: "Which receptor located deep in the dermis detects deep pressure and vibration?",
                options: ["Merkel disc", "Meissner's corpuscle", "Pacinian (lamellar) corpuscle", "Free nerve ending"],
                correctText: "Pacinian (lamellar) corpuscle",
                exp: "Pacinian corpuscles detect deep pressure and vibration."
            },
            {
                q: "Which muscle attached to hair follicles contracts to cause 'goosebumps'?",
                options: ["Arrector pili", "Orbicularis oculi", "Dartos muscle", "Levator palpebrae"],
                correctText: "Arrector pili",
                exp: "Arrector pili smooth muscles pull hair follicles upright."
            },
            {
                q: "The layer of skin containing stratified squamous keratinized epithelium is the:",
                options: ["Dermis", "Epidermis", "Hypodermis", "Subcutis"],
                correctText: "Epidermis",
                exp: "The epidermis consists entirely of keratinized stratified squamous tissue."
            },
            {
                q: "Which condition involves a yellowish skin discoloration due to excess bilirubin?",
                options: ["Cyanosis", "Erythema", "Jaundice", "Albinism"],
                correctText: "Jaundice",
                exp: "Jaundice is skin yellowing caused by high serum bilirubin levels."
            },
            {
                q: "The eponychium of the nail is commonly known as the:",
                options: ["Cuticle", "Quick", "Free edge", "Nail bed"],
                correctText: "Cuticle",
                exp: "The eponychium forms the proximal nail cuticle."
            },
            {
                q: "Ceruminous glands are modified apocrine glands located in the:",
                options: ["Oral cavity", "External auditory canal", "Mammary glands", "Eyelids"],
                correctText: "Ceruminous glands",
                exp: "Ceruminous glands produce earwax (cerumen) in the ear canal."
            },
            {
                q: "In burn assessment, the adult 'Rule of Nines' assigns what percentage to the entire head and neck?",
                options: ["4.5%", "9%", "18%", "36%"],
                correctText: "9%",
                exp: "Head and neck combined represent 9% of total body surface area."
            },
            {
                q: "Which epidermal layer exhibits active mitosis to continually replace skin cells?",
                options: ["Stratum corneum", "Stratum granulosum", "Stratum basale", "Stratum spinosum"],
                correctText: "Stratum basale",
                exp: "Stratum basale contains stem cells undergoing continuous cell division."
            },
            {
                q: "A full-thickness burn destroying both epidermis and dermis is classified as a:",
                options: ["First-degree burn", "Second-degree burn", "Third-degree burn", "Fourth-degree burn"],
                correctText: "Third-degree burn",
                exp: "Third-degree burns destroy the complete dermal and epidermal layers."
            },
            {
                q: "Which vitamin is synthesized in the skin upon exposure to solar UV radiation?",
                options: ["Vitamin A", "Vitamin C", "Vitamin D", "Vitamin K"],
                correctText: "Vitamin D",
                exp: "Skin cells synthesize Vitamin D3 precursor when exposed to UV light."
            },
            {
                q: "The bluish discoloration of skin due to inadequate oxygenation is termed:",
                options: ["Erythema", "Cyanosis", "Pallor", "Ecchymosis"],
                correctText: "Cyanosis",
                exp: "Cyanosis is a bluish tint resulting from low oxygen saturation."
            },
            {
                q: "What type of tissue composes the hypodermis?",
                options: ["Stratum corneum", "Areolar and adipose tissue", "Dense regular connective tissue", "Hyaline cartilage"],
                correctText: "Areolar and adipose tissue",
                exp: "Hypodermis consists of loose adipose and areolar tissue."
            },
            {
                q: "Granules containing glycolipids released in the stratum granulosum function to:",
                options: ["Synthesize pigment", "Waterproof the epidermal barrier", "Form keratin fibers", "Trigger inflammation"],
                correctText: "Waterproof the epidermal barrier",
                exp: "Glycolipids seal spaces between cells to prevent water loss."
            },
            {
                q: "The portion of hair embedded beneath the skin surface is called the:",
                options: ["Shaft", "Root", "Cuticle", "Bulb"],
                correctText: "Root",
                exp: "Hair root is the portion enclosed within the follicle."
            },
            {
                q: "The structural unit of compact bone tissue is an:",
                options: ["Osteocyte", "Osteon (Haversian system)", "Trabecula", "Canaliculus"],
                correctText: "Osteon (Haversian system)",
                exp: "Osteons form concentric cylindrical units in compact bone."
            },
            {
                q: "Which cell type is responsible for breaking down and resorbing bone matrix?",
                options: ["Osteoblast", "Osteoclast", "Osteogenic cell", "Osteocyte"],
                correctText: "Osteoclast",
                exp: "Osteoclasts release enzymes to dissolve bone matrix."
            },
            {
                q: "Unmineralized organic bone matrix secreted by osteoblasts is known as:",
                options: ["Hydroxyapatite", "Osteoid", "Osteon", "Callus"],
                correctText: "Osteoid",
                exp: "Osteoid is uncalcified collagen matrix."
            },
            {
                q: "Intramembranous ossification forms skull bones directly from:",
                options: ["Hyaline cartilage models", "Fibrous embryonic connective tissue (mesenchyme)", "Elastic cartilage", "Fibrocartilage"],
                correctText: "Fibrous embryonic connective tissue (mesenchyme)",
                exp: "Intramembranous ossification develops directly within mesenchymal sheets."
            },
            {
                q: "Endochondral ossification replaces a pre-existing model made of:",
                options: ["Fibrocartilage", "Hyaline cartilage", "Elastic cartilage", "Mesenchyme"],
                correctText: "Hyaline cartilage",
                exp: "Endochondral ossification replaces hyaline cartilage templates."
            },
            {
                q: "The primary ossification center during endochondral ossification develops in the:",
                options: ["Epiphysis", "Diaphysis", "Metaphysis", "Epiphyseal plate"],
                correctText: "Diaphysis",
                exp: "Primary ossification initiates in the bone shaft (diaphysis)."
            },
            {
                q: "Longitudinal bone growth in children occurs at the site of the:",
                options: ["Periosteum", "Endosteum", "Epiphyseal plate", "Sharpey's fibers"],
                correctText: "Epiphyseal plate",
                exp: "Cartilage proliferation at the epiphyseal plate lengthens bones."
            },
            {
                q: "Small channels connecting lacunae to each other for nutrient transport are:",
                options: ["Volkmann's canals", "Canaliculi", "Foramina", "Sharpey's fibers"],
                correctText: "Canaliculi",
                exp: "Canaliculi extend from lacunae to facilitate cell communication."
            },
            {
                q: "Which hormone raises blood calcium levels by stimulating osteoclasts?",
                options: ["Calcitonin", "Parathyroid hormone (PTH)", "Thyroxine", "Insulin"],
                correctText: "Parathyroid hormone (PTH)",
                exp: "PTH activates osteoclasts to resorb bone and release calcium."
            },
            {

        let activeQuizData = [];
        let userAnswers = {};
        let currentSlide = 0;
        let isSubmitted = false;

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function prepareShuffledQuiz() {
            let shuffledQuestions = shuffleArray(rawQuizData);

            activeQuizData = shuffledQuestions.map(item => {
                let shuffledOpts = shuffleArray(item.options);
                let newCorrectIndex = shuffledOpts.indexOf(item.correctText);

                return {
                    q: item.q,
                    img: item.img,
                    options: shuffledOpts,
                    correct: newCorrectIndex,
                    exp: item.exp
                };
            });
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            userAnswers = {};
            currentSlide = 0;
            isSubmitted = false;

            activeQuizData.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = `quiz-card ${index === 0 ? 'active' : ''}`;
                card.id = `card-${index}`;

                let imgHTML = data.img ? `<img src="${data.img}" alt="Question Image" class="diagram-img">` : '';

                let optionsHTML = data.options.map((opt, optIndex) => `
                    <button class="option-btn" onclick="selectOption(${index}, ${optIndex})">
                        ${String.fromCharCode(65 + optIndex)}. ${opt}
                    </button>
                `).join('');

                card.innerHTML = `
                    <div class="question-number">Question ${index + 1} of ${activeQuizData.length}</div>
                    <div class="question-text">${data.q}</div>
                    ${imgHTML}
                    <div class="options-container" id="options-${index}">
                        ${optionsHTML}
                    </div>
                    <div class="explanation" id="explanation-${index}">
                        <strong>Rationale:</strong> ${data.exp}
                    </div>
                `;
                container.appendChild(card);
            });

            updateSlideUI();
            updateProgressTracker();
        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers.hasOwnProperty(qIndex) || isSubmitted) return;

            userAnswers[qIndex] = optIndex;
            const data = activeQuizData[qIndex];
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            const explanationDiv = document.getElementById(`explanation-${qIndex}`);

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;

                if (i === data.correct) {
                    buttons[i].classList.add('correct');
                }

                if (optIndex === i && optIndex !== data.correct) {
                    buttons[i].classList.add('incorrect');
                }
            }

            explanationDiv.style.display = 'block';
            updateProgressTracker();
        }

        function updateProgressTracker() {
            const answeredCount = Object.keys(userAnswers).length;
            document.getElementById('progress-counter').innerText = `${answeredCount} / ${activeQuizData.length} Answered`;
        }

        function navigateSlide(direction) {
            const newIndex = currentSlide + direction;
            if (newIndex >= 0 && newIndex < activeQuizData.length) {
                jumpToSlide(newIndex);
            }
        }

        function jumpToSlide(index) {
            document.getElementById(`card-${currentSlide}`).classList.remove('active');
            currentSlide = index;
            document.getElementById(`card-${currentSlide}`).classList.add('active');

            updateSlideUI();
        }

        function updateSlideUI() {
            document.getElementById('prev-btn').disabled = (currentSlide === 0);
            document.getElementById('next-btn').disabled = (currentSlide === activeQuizData.length - 1);
        }

        document.addEventListener('keydown', (e) => {
            if (isSubmitted) return;
            if (e.key === 'ArrowLeft') {
                navigateSlide(-1);
            } else if (e.key === 'ArrowRight') {
                navigateSlide(1);
            }
        });

        function calculateScore() {
            isSubmitted = true;
            let score = 0;

            activeQuizData.forEach((data, index) => {
                const selected = userAnswers[index];
                if (selected === data.correct) {
                    score++;
                }
            });

            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('controls-panel').style.display = 'none';

            const resultsCard = document.getElementById('results-card');
            resultsCard.style.display = 'block';

            document.getElementById('score-text').innerText = `${score} / ${activeQuizData.length}`;
            const percentage = Math.round((score / activeQuizData.length) * 100);
            document.getElementById('percentage-text').innerText = `Your Score: ${percentage}%`;
            sendQuizResult(score, questions.length);
        }

        function resetQuiz() {
            document.getElementById('results-card').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('controls-panel').style.display = 'flex';

            prepareShuffledQuiz();
            renderQuiz();
        }

        prepareShuffledQuiz();
        renderQuiz();

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzCrgU6F4A0NbwipwkSNaxkLiPaEfXVOgA83cTnH_bbn7OjxeWbXzriS2Q0Z_cQNLEw/exec";

function sendQuizResult(score, total) {
    const data = {
        user: "Anonymous",
        device: navigator.userAgent,
        quiz: "Medium",
        score: score + "/" + total,
        percentage: Math.round((score / total) * 100),
        time: new Date().toLocaleTimeString(),
        completed: true
    };

    fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain"
        },
        body: JSON.stringify(data)
    });
}
</script>
