let answersRevealed = false;

function renderQuiz() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        let optionsHTML = '';
        item.options.forEach((opt, optIdx) => {
            optionsHTML += `
                <li class="option-item">
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="${optIdx}">
                        <span>${opt}</span>
                    </label>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="question-num">Question ${index + 1} of 100</div>
            <div class="question-text">${item.q}</div>
            <ul class="options-list">
                ${optionsHTML}
            </ul>
            <div class="feedback" id="feedback-${index}"></div>
        `;

        container.appendChild(card);
    });

    if (window.MathJax) {
        MathJax.typesetPromise();
    }
}

function submitQuiz() {
    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const feedback = document.getElementById(`feedback-${index}`);
        
        feedback.style.display = 'block';

        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === item.answer) {
                score++;
                feedback.className = 'feedback correct';
                feedback.innerHTML = `Correct!`;
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `Incorrect. Correct Answer: ${item.options[item.answer]}`;
            }
        } else {
            feedback.className = 'feedback incorrect';
            feedback.innerHTML = `Not Answered. Correct Answer: ${item.options[item.answer]}`;
        }
    });

    const scoreBoard = document.getElementById('score-board');
    scoreBoard.style.display = 'block';
    scoreBoard.innerHTML = `You scored ${score} out of 100 (${((score / 100) * 100).toFixed(1)}%)`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleAnswers() {
    answersRevealed = !answersRevealed;
    quizData.forEach((item, index) => {
        const feedback = document.getElementById(`feedback-${index}`);
        if (answersRevealed) {
            feedback.style.display = 'block';
            feedback.className = 'feedback correct';
            feedback.innerHTML = `Answer: ${item.options[item.answer]}`;
        } else {
            feedback.style.display = 'none';
        }
    });
}

// Initialize on page load
window.onload = renderQuiz;
